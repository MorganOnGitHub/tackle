<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="960" height="190" role="img" aria-labelledby="title desc">
  <title id="title">Process for a one-line config change</title>
  <desc id="desc">Superpowers runs nine sequential steps: explore context, offer visual, clarifying questions, two to three approaches, present design, write spec, spec review loop, you review spec, write plan. Tackle runs two: make the change, verify.</desc>
  <style>
    .fg { fill: #57606a; }
    .bx { stroke: #afb8c1; fill: none; }
    .ac { fill: #1a7f37; }
    .acx { stroke: #1a7f37; fill: none; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #9198a1; }
      .bx { stroke: #3d444d; }
      .ac { fill: #3fb950; }
      .acx { stroke: #3fb950; }
    }
  </style>

  <text class="fg" x="0" y="16" font-size="12.5" font-weight="600">For a one-line config change</text>

  <text class="fg" x="112" y="70" font-size="12" font-weight="600" text-anchor="end">superpowers</text>
  <g class="bx" stroke-width="1.2">
    <rect x="130" y="40" width="82" height="52" rx="6"/>
    <rect x="222" y="40" width="82" height="52" rx="6"/>
    <rect x="314" y="40" width="82" height="52" rx="6"/>
    <rect x="406" y="40" width="82" height="52" rx="6"/>
    <rect x="498" y="40" width="82" height="52" rx="6"/>
    <rect x="590" y="40" width="82" height="52" rx="6"/>
    <rect x="682" y="40" width="82" height="52" rx="6"/>
    <rect x="774" y="40" width="82" height="52" rx="6"/>
    <rect x="866" y="40" width="82" height="52" rx="6"/>
  </g>
  <g class="fg" font-size="10.5" text-anchor="middle">
    <text x="171" y="63">Explore<tspan x="171" dy="13">context</tspan></text>
    <text x="263" y="63">Offer<tspan x="263" dy="13">visual</tspan></text>
    <text x="355" y="63">Clarifying<tspan x="355" dy="13">questions</tspan></text>
    <text x="447" y="63">2–3<tspan x="447" dy="13">approaches</tspan></text>
    <text x="539" y="63">Present<tspan x="539" dy="13">design</tspan></text>
    <text x="631" y="63">Write<tspan x="631" dy="13">spec</tspan></text>
    <text x="723" y="63">Spec review<tspan x="723" dy="13">loop</tspan></text>
    <text x="815" y="63">You review<tspan x="815" dy="13">spec</tspan></text>
    <text x="907" y="63">Write<tspan x="907" dy="13">plan</tspan></text>
  </g>

  <text class="ac" x="112" y="142" font-size="12" font-weight="600" text-anchor="end">Tackle</text>
  <g class="acx" stroke-width="1.6">
    <rect x="130" y="112" width="82" height="52" rx="6"/>
    <rect x="222" y="112" width="82" height="52" rx="6"/>
  </g>
  <g class="ac" font-size="10.5" text-anchor="middle">
    <text x="171" y="135">Make the<tspan x="171" dy="13">change</tspan></text>
    <text x="263" y="142">Verify</text>
  </g>
</svg>
